# Blueprint de Render · https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gonzalez-inmuebles
    runtime: node
    plan: starter            # el plan free no admite discos persistentes
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        sync: false          # se carga a mano en el panel de Render
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
